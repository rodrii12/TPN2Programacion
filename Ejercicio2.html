<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2</title>
</head>

<body>
  <p id="resultado"></p>
  <script type="module">
    import { seleccionDeConversion, convertirMoneda, agregarTasas } from './miLibreriaEJ2.js';
    let impuesto = 2 / 100;
    let continuar, opcion, tasa;
    let monto, montoConvertido, montoConImpuesto;
    let tasas = {
      dolares: 0,
      euros: 0,
      libras: 0,
      yen: 0,
      real: 0,
      yuan: 0
    }
    agregarTasas(tasas);

    do {
      opcion = parseInt(prompt("Ingrese la opción de conversión (1: Dólares, 2: Euros, 3: Libras, 4: Yen, 5: Real, 6: Yuan):"));
      tasa = seleccionDeConversion(opcion, tasas);
      console.log(tasa === 0
        ? 'Opción no válida.'
        : 'Tasa de conversión: ' + tasa);

      monto = parseFloat(prompt("Ingrese el monto a convertir:"));
      montoConvertido = convertirMoneda(monto, tasa);
      montoConImpuesto = montoConvertido > 20000 ? Number(montoConvertido * (1 + impuesto)).toFixed(2) : "No aplica";
      console.log(' | Resultado de la conversión: ' + montoConvertido);
      console.log(' | Monto con impuesto: ' + montoConImpuesto);
      continuar = prompt('Ingrese 1 para continuar');
    } while (continuar === '1');


  </script>
</body>

</html>
