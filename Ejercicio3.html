<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Con Librería</title>
</head>
<body>

    <script type="module">
        // Importación de librería
        import { calcularPorcentaje } from './miLibreria.js';

        let bandera = 0;

        while (bandera === 0) {
            let precioIngresado = Number(prompt("Ingrese el precio a calcular:"));
            
            while (precioIngresado <= 0 || isNaN(precioIngresado)) {
                alert("El precio ingresado no es válido. Por favor, ingrese un valor mayor a 0.");
                precioIngresado = Number(prompt("Ingrese el precio a calcular:"));
            } 

            // Creación del objeto para enviarlos por referencia
            let producto = {
                precio: precioIngresado,
                porcentajeAplicado: 0,
                aumento: 0,
                precioFinal: 0
            };

            // Todos los cálculos se hacen llamando al procedimiento
            calcularPorcentaje(producto);
                
            // Las modificaciones realizadas en la librería se observan en el programa principal
            console.log(`\n--- RESULTADOS DESPUÉS DEL PROCEDIMIENTO ---`);
            console.log(`Porcentaje aplicado: ${producto.porcentajeAplicado}%`);
            console.log(`Aumento calculado: $${producto.aumento}`);
            console.log(`Precio actualizado: $${producto.precioFinal}\n`);
            
            // variable bandera para controlar la salida del bucle
            bandera = Number(prompt("Ingrese 0 para continuar o cualquier otro número para salir:"));
        }
    </script>
</body>
</html>
